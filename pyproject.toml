[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "telegram-ticker-collector"
version = "0.4.0"
description = "Private stock scanner fed by a Telegram ticker collector"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "aiosqlite>=0.20,<1",
  "fastapi>=0.115,<1",
  "python-dotenv>=1,<2",
  "python-telegram-bot>=22,<23",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
  "ruff>=0.8,<1",
]

[project.scripts]
ticker-bot = "ticker_bot.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ticker_bot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

